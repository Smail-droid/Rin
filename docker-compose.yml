version: '3.8'

services:
  rin-blog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rin-gallery-blog
    restart: unless-stopped
    ports:
      - "11498:11498"
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - RIN_SERVER_PORT=11498
    volumes:
      # 持久化本地 SQLite 数据库与上传图片缓存
      - ./data:/app/.wrangler
      - ./cache:/app/.vite
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:11498/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
