<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="rainbowHair5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="bottomFade5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#searchGrad)"/>

  <!-- Tech Detective Blueprint Grid -->
  <g stroke="#0284c7" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Giant Glowing Magnifying Glass on Left -->
  <g transform="translate(200, 220)" filter="url(#shadow5)">
    <!-- Lens Rim -->
    <circle cx="0" cy="0" r="75" fill="#ffffff" fill-opacity="0.3" stroke="#fde047" stroke-width="9"/>
    <!-- Glass Reflection -->
    <path d="M -45,-45 A 64 64 0 0 1 45,-45" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Detective Paw print inside lens -->
    <ellipse cx="0" cy="8" rx="20" ry="16" fill="#0284c7" fill-opacity="0.4"/>
    <circle cx="-16" cy="-8" r="6" fill="#0284c7" fill-opacity="0.4"/>
    <circle cx="-6" cy="-18" r="7" fill="#0284c7" fill-opacity="0.4"/>
    <circle cx="6" cy="-18" r="7" fill="#0284c7" fill-opacity="0.4"/>
    <circle cx="16" cy="-8" r="6" fill="#0284c7" fill-opacity="0.4"/>
    <!-- Handle -->
    <rect x="52" y="52" width="22" height="70" rx="10" transform="rotate(-45 52 52)" fill="#ea580c" stroke="#1e293b" stroke-width="4.5"/>
  </g>

  <!-- Anime Detective Mascot on Right -->
  <g transform="translate(560, 210)" filter="url(#shadow5)">
    <!-- Cat Ears -->
    <path d="M -60,-70 L -100,-150 L -30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M -55,-80 L -85,-135 L -38,-110 Z" fill="#38bdf8"/>
    <path d="M 60,-70 L 100,-150 L 30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M 55,-80 L 85,-135 L 38,-110 Z" fill="#38bdf8"/>

    <!-- Rainbow Hair -->
    <path d="M -105,-50 C -115,40 -85,130 -45,160 C 0,170 45,170 85,140 C 115,110 115,30 105,-50 Z" fill="url(#rainbowHair5)" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="60" fill="#fff1f2" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="-42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>
    <ellipse cx="42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>

    <!-- Left Eye (Sparkling Target) -->
    <g transform="translate(-30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#0284c7" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
    </g>
    <!-- Right Eye -->
    <g transform="translate(30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#0284c7" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
    </g>
    <path d="M -8,22 Q 0,30 8,22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Detective Hat -->
    <ellipse cx="0" cy="-65" rx="75" ry="16" fill="#ea580c" stroke="#1e293b" stroke-width="4"/>
    <path d="M -45,-65 C -45,-120 45,-120 45,-65 Z" fill="#c2410c" stroke="#1e293b" stroke-width="4"/>
    <rect x="-16" y="-75" width="32" height="12" rx="3" fill="#fde047" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Speech bubble doodle: "真相只有一个喵！🔍" -->
  <g transform="translate(370, 100)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
    <text x="0" y="6" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="16" fill="#0284c7" text-anchor="middle">随心探索 · 发现新知 🔍</text>
  </g>

  <rect y="240" width="800" height="240" fill="url(#bottomFade5)"/>
</svg>
