<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="35%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Warm Sunset Sun -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Vignette Glow -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.45"/>
    </radialGradient>

    <!-- Cat Paw Shape Definition -->
    <g id="catPaw" fill="#ffffff" fill-opacity="0.32">
      <!-- Main pad -->
      <path d="M 0,8 C -14,8 -22,20 -18,34 C -14,48 14,48 18,34 C 22,20 14,8 0,8 Z"/>
      <!-- 4 Toe beans -->
      <circle cx="-16" cy="-2" r="6"/>
      <circle cx="-6" cy="-10" r="6.5"/>
      <circle cx="6" cy="-10" r="6.5"/>
      <circle cx="16" cy="-2" r="6"/>
    </g>

    <!-- Floating Paper Sheet -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#7c2d12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Warm Sun Glow -->
  <circle cx="640" cy="140" r="220" fill="url(#sunGrad)"/>

  <!-- Distant Hill Curves -->
  <path d="M 0,380 Q 240,320 480,360 T 800,340 L 800,480 L 0,480 Z" fill="#ea580c" fill-opacity="0.25"/>
  <path d="M 0,420 Q 320,360 620,400 T 800,390 L 800,480 L 0,480 Z" fill="#9a3412" fill-opacity="0.3"/>

  <!-- Wooden Desk Surface -->
  <rect x="0" y="410" width="800" height="70" fill="#7c2d12" fill-opacity="0.2"/>

  <!-- Stylized Polaroid Photo Frame on Desk -->
  <g transform="translate(140, 160) rotate(-6)" filter="url(#shadow)">
    <rect x="-70" y="-85" width="140" height="170" rx="8" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="-58" y="-73" width="116" height="116" rx="4" fill="#fb923c" fill-opacity="0.35"/>
    <!-- Heart sketch in polaroid -->
    <path d="M -10,-15 C -20,-30 -35,-15 -25,0 L 0,25 L 25,0 C 35,-15 20,-30 10,-15 Z" fill="#ea580c" fill-opacity="0.4" transform="scale(0.5) translate(0, -30)"/>
    <!-- Washi tape on polaroid -->
    <rect x="-25" y="-95" width="50" height="18" rx="2" fill="#fed7aa" fill-opacity="0.75" transform="rotate(3)"/>
  </g>

  <!-- Cute Coffee Mug with Steam -->
  <g transform="translate(680, 360)">
    <!-- Mug Body -->
    <path d="M -22,0 L -18,44 C -18,52 18,52 18,44 L 22,0 Z" fill="#ffffff" fill-opacity="0.6"/>
    <!-- Mug Handle -->
    <path d="M 20,10 C 34,10 34,34 19,34" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.6" stroke-linecap="round"/>
    <!-- Steam Curves -->
    <path d="M -6,-10 Q -12,-25 -4,-38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M 6,-8 Q 0,-24 8,-42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Scattered Floating Cat Paws -->
  <use href="#catPaw" x="380" y="110" transform="rotate(14 380 110) scale(1.1)"/>
  <use href="#catPaw" x="490" y="190" transform="rotate(-18 490 190) scale(0.9)"/>
  <use href="#catPaw" x="320" y="260" transform="rotate(25 320 260) scale(0.8)"/>
  <use href="#catPaw" x="580" y="290" transform="rotate(-8 580 290) scale(1)"/>
  <use href="#catPaw" x="220" y="380" transform="rotate(12 220 380) scale(0.7)"/>

  <!-- Warm ambient light particles / bokeh -->
  <circle cx="280" cy="90" r="14" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="460" cy="70" r="22" fill="#ffffff" fill-opacity="0.2"/>
  <circle cx="580" cy="110" r="10" fill="#ffffff" fill-opacity="0.3"/>
  <circle cx="160" cy="280" r="18" fill="#ffffff" fill-opacity="0.15"/>
  <circle cx="720" cy="240" r="16" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Vignette finish for readability -->
  <rect width="800" height="480" fill="url(#vignette)"/>
</svg>
