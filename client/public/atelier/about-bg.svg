<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Warm Anime Cream & Peach Gradient -->
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="40%" stop-color="#ffedd5"/>
      <stop offset="80%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>

    <!-- Rainbow Hair Gradients -->
    <linearGradient id="rainbowHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Soft Vignette Gradient -->
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#7c2d12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Canvas with grid paper texture lines -->
  <rect width="800" height="480" fill="url(#aboutGrad)"/>

  <!-- Subtle Manga Doodle Grid Lines -->
  <g stroke="#ea580c" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Manga Doodles: Stars, Sparkles & Cat Paws -->
  <g fill="#ea580c" fill-opacity="0.25">
    <!-- Cat Paws -->
    <path d="M 120,70 C 110,70 102,80 106,90 C 110,100 130,100 134,90 C 138,80 130,70 120,70 Z"/>
    <circle cx="108" cy="62" r="4"/><circle cx="116" cy="56" r="4.5"/><circle cx="124" cy="56" r="4.5"/><circle cx="132" cy="62" r="4"/>

    <path d="M 680,120 C 670,120 662,130 666,140 C 670,150 690,150 694,140 C 698,130 690,120 680,120 Z"/>
    <circle cx="668" cy="112" r="4"/><circle cx="676" cy="106" r="4.5"/><circle cx="684" cy="106" r="4.5"/><circle cx="692" cy="112" r="4"/>
  </g>

  <!-- Manga Sparkles -->
  <g fill="#f97316" fill-opacity="0.35">
    <path d="M 280,60 Q 280,75 295,75 Q 280,75 280,90 Q 280,75 265,75 Q 280,75 280,60 Z"/>
    <path d="M 620,60 Q 620,72 632,72 Q 620,72 620,84 Q 620,72 608,72 Q 620,72 620,60 Z"/>
    <path d="M 720,220 Q 720,232 732,232 Q 720,232 720,244 Q 720,232 708,232 Q 720,232 720,220 Z"/>
  </g>

  <!-- Manga Anime Character (Rainbow-haired chibi with cat ears) -->
  <g transform="translate(480, 220)" filter="url(#softShadow)">
    <!-- Cat Ears -->
    <!-- Left Ear -->
    <path d="M -65,-70 L -105,-150 L -35,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M -60,-80 L -90,-135 L -42,-110 Z" fill="#fda4af"/>
    <!-- Right Ear -->
    <path d="M 65,-70 L 105,-150 L 35,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 60,-80 L 90,-135 L 42,-110 Z" fill="#fda4af"/>

    <!-- Rainbow Hair Back -->
    <path d="M -110,-50 C -120,40 -90,140 -50,170 C 0,180 50,180 90,150 C 120,120 120,30 110,-50 Z" fill="url(#rainbowHair)" stroke="#1e293b" stroke-width="4.5"/>

    <!-- Face Base -->
    <ellipse cx="0" cy="0" rx="72" ry="62" fill="#fff1f2" stroke="#1e293b" stroke-width="4.5"/>

    <!-- Blushing Cheeks -->
    <ellipse cx="-44" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>
    <ellipse cx="44" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>

    <!-- Big Sparkly Anime Eyes -->
    <!-- Left Eye -->
    <g transform="translate(-32, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="20" fill="#0284c7" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-7" r="6" fill="#ffffff"/>
      <circle cx="5" cy="5" r="3" fill="#ffffff"/>
      <!-- Eyelashes -->
      <path d="M -16,-18 Q 0,-24 16,-18" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <!-- Right Eye (Winking) -->
    <g transform="translate(32, -4)">
      <path d="M -14,-2 Q 0,-14 14,-2" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="-5" cy="-7" r="5" fill="#ffffff" fill-opacity="0.5"/>
    </g>

    <!-- Cute Cat Mouth -->
    <path d="M -8,22 Q -4,28 0,22 Q 4,28 8,22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Hair Bangs -->
    <path d="M -75,-30 C -60,-80 60,-80 75,-30 C 50,-10 30,-30 0,-15 C -30,-30 -50,-10 -75,-30 Z" fill="url(#rainbowHair)" stroke="#1e293b" stroke-width="4.5"/>

    <!-- Headband / Head Bow -->
    <rect x="-30" y="-82" width="60" height="14" rx="7" fill="#38bdf8" stroke="#1e293b" stroke-width="3"/>
    <circle cx="0" cy="-75" r="9" fill="#fde047" stroke="#1e293b" stroke-width="3"/>

    <!-- Scarf / Clothes -->
    <path d="M -50,60 C -20,85 20,85 50,60 L 60,110 L -60,110 Z" fill="#38bdf8" stroke="#1e293b" stroke-width="4.5"/>
    <circle cx="0" cy="85" r="12" fill="#fbbf24" stroke="#1e293b" stroke-width="3.5"/>
  </g>

  <!-- Cute Doodle Speech Bubble: "欢迎光临喵~🐾" -->
  <g transform="translate(260, 140)">
    <path d="M -110,-35 L 90,-35 C 105,-35 115,-25 115,-10 L 115,20 C 115,35 105,45 90,45 L -70,45 L -95,65 L -85,45 L -110,45 C -125,45 -135,35 -135,20 L -135,-10 C -135,-25 -125,-35 -110,-35 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="-10" y="14" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="19" fill="#1e293b" text-anchor="middle">欢迎光临 80hou 🐾</text>
  </g>

  <!-- Laptop / Keyboard Doodle on Left -->
  <g transform="translate(140, 280) rotate(-4)">
    <rect x="-60" y="-40" width="120" height="80" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <rect x="-50" y="-30" width="100" height="60" rx="4" fill="#38bdf8" fill-opacity="0.3"/>
    <!-- Terminal code lines -->
    <line x1="-40" y1="-15" x2="20" y2="-15" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="-40" y1="15" x2="-10" y2="15" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bottom Dark Vignette Overlay for Clear Text Readability -->
  <rect y="240" width="800" height="240" fill="url(#bottomFade)"/>
</svg>
