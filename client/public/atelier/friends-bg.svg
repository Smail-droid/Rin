<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="35%" stop-color="#fce7f3"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <linearGradient id="rainbowHair4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="bottomFade4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#831843" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#sakuraGrad)"/>

  <!-- Anime Manga Grid -->
  <g stroke="#db2777" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Cute Vintage Sakura Postbox on Left -->
  <g transform="translate(160, 240)" filter="url(#shadow4)">
    <rect x="-8" y="50" width="16" height="80" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <path d="M -40,50 L -40,-30 C -40,-60 40,-60 40,-30 L 40,50 Z" fill="#f43f5e" stroke="#1e293b" stroke-width="5"/>
    <rect x="-24" y="-12" width="48" height="8" rx="3" fill="#1e293b"/>
    <!-- Heart Badge -->
    <circle cx="0" cy="18" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <path d="M 0,14 C -3,9 -8,12 -5,16 L 0,21 L 5,16 C 8,12 3,9 0,14 Z" fill="#e11d48"/>
  </g>

  <!-- Flying Paper Airplanes & Letters -->
  <g transform="translate(320, 140) rotate(-18)">
    <rect x="-35" y="-22" width="70" height="44" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <path d="M -35,-22 L 0,4 L 35,-22" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="0" cy="4" r="5" fill="#f43f5e"/>
  </g>

  <g transform="translate(420, 80) rotate(15)">
    <polygon points="0,-25 35,15 0,5 -35,15" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <line x1="0" y1="-25" x2="0" y2="5" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Anime Manga Character on Right: Holding Friendship Letter with Smile -->
  <g transform="translate(600, 210)" filter="url(#shadow4)">
    <path d="M -60,-70 L -100,-150 L -30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M -55,-80 L -85,-135 L -38,-110 Z" fill="#f472b6"/>
    <path d="M 60,-70 L 100,-150 L 30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M 55,-80 L 85,-135 L 38,-110 Z" fill="#f472b6"/>

    <path d="M -105,-50 C -115,40 -85,130 -45,160 C 0,170 45,170 85,140 C 115,110 115,30 105,-50 Z" fill="url(#rainbowHair4)" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="60" fill="#fff1f2" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="-42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>
    <ellipse cx="42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>

    <!-- Left Eye -->
    <g transform="translate(-30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#db2777" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
    </g>
    <!-- Right Eye -->
    <g transform="translate(30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#db2777" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
    </g>
    <path d="M -8,22 Q 0,30 8,22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bangs with Sakura Flower Clip -->
    <path d="M -70,-30 C -55,-80 55,-80 70,-30 C 45,-10 25,-30 0,-15 C -25,-30 -45,-10 -70,-30 Z" fill="url(#rainbowHair4)" stroke="#1e293b" stroke-width="4.5"/>
    <!-- Hair Flower Clip -->
    <circle cx="48" cy="-55" r="10" fill="#f43f5e" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="48" cy="-55" r="4" fill="#fde047"/>
  </g>

  <!-- Sakura Petals floating around -->
  <g fill="#f472b6" opacity="0.6">
    <ellipse cx="280" cy="80" rx="10" ry="6" transform="rotate(30 280 80)"/>
    <ellipse cx="380" cy="280" rx="12" ry="7" transform="rotate(-40 380 280)"/>
    <ellipse cx="480" cy="380" rx="9" ry="5" transform="rotate(15 480 380)"/>
    <ellipse cx="720" cy="120" rx="11" ry="6" transform="rotate(50 720 120)"/>
    <ellipse cx="100" cy="120" rx="8" ry="5" transform="rotate(-25 100 120)"/>
  </g>

  <!-- Speech bubble doodle: "交换友链喵~🌸" -->
  <g transform="translate(380, 200)">
    <rect x="-70" y="-22" width="140" height="44" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
    <text x="0" y="6" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="16" fill="#be185d" text-anchor="middle">友谊长存 · 友链 💌</text>
  </g>

  <rect y="240" width="800" height="240" fill="url(#bottomFade4)"/>
</svg>
