<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Romantic Sakura & Lavender Gradient -->
    <linearGradient id="sakuraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="35%" stop-color="#fce7f3"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Warm Spring Sun / Glow -->
    <radialGradient id="springSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#fbcfe8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="sakuraVignette" cx="50%" cy="50%" r="70%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#831843" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Cherry Blossom Petal -->
    <path id="sakuraPetal" d="M 0,-18 C -14,-14 -14,14 0,18 C 14,14 14,-14 0,-18 Z" fill="#ffffff" fill-opacity="0.45"/>

    <!-- Complete Sakura 5-Petal Flower -->
    <g id="sakuraFlower">
      <use href="#sakuraPetal" transform="rotate(0)"/>
      <use href="#sakuraPetal" transform="rotate(72)"/>
      <use href="#sakuraPetal" transform="rotate(144)"/>
      <use href="#sakuraPetal" transform="rotate(216)"/>
      <use href="#sakuraPetal" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="4" fill="#fda4af"/>
    </g>
  </defs>

  <!-- Base background -->
  <rect width="800" height="480" fill="url(#sakuraBg)"/>

  <!-- Warm Spring Sun Orb in top center -->
  <circle cx="480" cy="120" r="240" fill="url(#springSun)"/>

  <!-- Distant Spring Garden Hills -->
  <path d="M 0,360 Q 200,300 440,340 T 800,320 L 800,480 L 0,480 Z" fill="#f43f5e" fill-opacity="0.2"/>
  <path d="M 0,400 Q 280,340 560,380 T 800,370 L 800,480 L 0,480 Z" fill="#be185d" fill-opacity="0.25"/>

  <!-- Vintage Garden Postbox Silhouette on Left -->
  <g transform="translate(130, 290)">
    <!-- Postbox Pillar Pole -->
    <rect x="-6" y="50" width="12" height="100" fill="#ffffff" fill-opacity="0.4" rx="3"/>
    <!-- Postbox Body -->
    <path d="M -30,50 L -30,-20 C -30,-45 30,-45 30,-20 L 30,50 Z" fill="#ffffff" fill-opacity="0.65"/>
    <!-- Letter Slot -->
    <rect x="-18" y="-5" width="36" height="5" rx="2" fill="#be185d" fill-opacity="0.4"/>
    <!-- Red Heart Stamp -->
    <circle cx="0" cy="20" r="12" fill="#f43f5e" fill-opacity="0.5"/>
    <path d="M 0,16 C -3,11 -8,14 -5,18 L 0,23 L 5,18 C 8,14 3,11 0,16 Z" fill="#ffffff"/>
  </g>

  <!-- Flying Airmail Envelopes with Heart Stamp -->
  <g transform="translate(360, 220) rotate(-14)">
    <rect x="-45" y="-30" width="90" height="60" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#f472b6" stroke-width="2"/>
    <!-- Envelope Flap Lines -->
    <path d="M -45,-30 L 0,8 L 45,-30" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="7" fill="#f43f5e" fill-opacity="0.65"/>
  </g>

  <!-- Flying Paper Airplane with Dashed Flight Path -->
  <g transform="translate(580, 160) rotate(18)">
    <path d="M 0,-25 L 45,20 L 0,8 L -45,20 Z" fill="#ffffff" fill-opacity="0.75" stroke="#f472b6" stroke-width="1.5"/>
    <path d="M 0,-25 L 0,8" stroke="#f472b6" stroke-width="1.5"/>
  </g>
  <!-- Airplane dotted wind trail -->
  <path d="M 380,310 Q 460,280 540,190" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6 8"/>

  <!-- Blossoming Sakura Flowers -->
  <use href="#sakuraFlower" x="240" y="80" transform="rotate(15 240 80) scale(1.1)"/>
  <use href="#sakuraFlower" x="660" y="110" transform="rotate(-25 660 110) scale(1.3)"/>
  <use href="#sakuraFlower" x="720" y="240" transform="rotate(35 720 240) scale(0.9)"/>
  <use href="#sakuraFlower" x="480" y="360" transform="rotate(-15 480 360) scale(1)"/>
  <use href="#sakuraFlower" x="290" y="390" transform="rotate(42 290 390) scale(0.8)"/>

  <!-- Drifting Sakura Petals in the Wind -->
  <use href="#sakuraPetal" x="180" y="140" transform="rotate(45 180 140) scale(0.9)"/>
  <use href="#sakuraPetal" x="320" y="150" transform="rotate(-30 320 150) scale(0.7)"/>
  <use href="#sakuraPetal" x="430" y="90" transform="rotate(65 430 90) scale(0.8)"/>
  <use href="#sakuraPetal" x="510" y="260" transform="rotate(-50 510 260) scale(1.1)"/>
  <use href="#sakuraPetal" x="620" y="320" transform="rotate(20 620 320) scale(0.85)"/>
  <use href="#sakuraPetal" x="760" y="360" transform="rotate(-65 760 360) scale(0.75)"/>

  <!-- Vignette for high text contrast -->
  <rect width="800" height="480" fill="url(#sakuraVignette)"/>
</svg>
