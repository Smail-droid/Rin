<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Deep Cosmic Gradient -->
    <linearGradient id="cosmicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="35%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Glowing River of Light -->
    <linearGradient id="riverGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <!-- Central Temporal Nebula Core -->
    <radialGradient id="nebulaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="cosmicVignette" cx="50%" cy="50%" r="70%">
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base cosmic background -->
  <rect width="800" height="480" fill="url(#cosmicBg)"/>

  <!-- Nebula Core Glow -->
  <circle cx="400" cy="240" r="320" fill="url(#nebulaCore)"/>

  <!-- Flowing River of Time Stream (Curved S-shape wave) -->
  <path d="M -50,180 C 180,60 300,340 500,220 C 650,120 720,260 850,200 L 850,280 C 720,340 650,200 500,300 C 300,420 180,140 -50,260 Z" fill="url(#riverGrad)"/>

  <!-- Secondary Temporal Stream -->
  <path d="M -50,320 C 220,220 340,400 580,310 C 720,250 780,360 850,330" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="8 12"/>

  <!-- Constellation Lines & Milestones -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="120" y1="100" x2="220" y2="150"/>
    <line x1="220" y1="150" x2="310" y2="90"/>
    <line x1="310" y1="90" x2="420" y2="130"/>
    <line x1="420" y1="130" x2="540" y2="80"/>
    <line x1="540" y1="80" x2="680" y2="120"/>

    <line x1="160" y1="360" x2="270" y2="310"/>
    <line x1="270" y1="310" x2="380" y2="370"/>
    <line x1="380" y1="370" x2="490" y2="330"/>
    <line x1="490" y1="330" x2="620" y2="390"/>
    <line x1="620" y1="390" x2="710" y2="340"/>
  </g>

  <!-- Constellation Stars -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <circle cx="120" cy="100" r="4"/>
    <circle cx="220" cy="150" r="5" fill="#38bdf8"/>
    <circle cx="310" cy="90" r="3.5"/>
    <circle cx="420" cy="130" r="6" fill="#fbcfe8"/>
    <circle cx="540" cy="80" r="4"/>
    <circle cx="680" cy="120" r="5" fill="#38bdf8"/>

    <circle cx="160" cy="360" r="3.5"/>
    <circle cx="270" cy="310" r="5" fill="#c084fc"/>
    <circle cx="380" cy="370" r="4.5"/>
    <circle cx="490" cy="330" r="6" fill="#38bdf8"/>
    <circle cx="620" cy="390" r="4"/>
    <circle cx="710" cy="340" r="4.5"/>
  </g>

  <!-- Stylized Hourglass / Pocket Watch Dial Motif -->
  <g transform="translate(400, 240)" opacity="0.35">
    <!-- Outer Astronomical Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#e0e7ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#e0e7ff" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#e0e7ff" stroke-width="1.5"/>

    <!-- Clock Tick Marks -->
    <line x1="0" y1="-105" x2="0" y2="-95" stroke="#ffffff" stroke-width="3"/>
    <line x1="105" y1="0" x2="95" y2="0" stroke="#ffffff" stroke-width="3"/>
    <line x1="0" y1="105" x2="0" y2="95" stroke="#ffffff" stroke-width="3"/>
    <line x1="-105" y1="0" x2="-95" y2="0" stroke="#ffffff" stroke-width="3"/>

    <!-- Dial Hands -->
    <line x1="0" y1="0" x2="42" y2="-42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-28" y2="28" stroke="#f472b6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Scattered Stardust Points -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="80" cy="220" r="1.5"/>
    <circle cx="140" cy="50" r="1"/>
    <circle cx="230" cy="410" r="2"/>
    <circle cx="340" cy="180" r="1.5"/>
    <circle cx="480" cy="430" r="1"/>
    <circle cx="560" cy="190" r="2"/>
    <circle cx="640" cy="50" r="1.5"/>
    <circle cx="750" cy="240" r="2"/>
    <circle cx="780" cy="400" r="1"/>
    <circle cx="50" cy="380" r="1.5"/>
  </g>

  <!-- Vignette -->
  <rect width="800" height="480" fill="url(#cosmicVignette)"/>
</svg>
