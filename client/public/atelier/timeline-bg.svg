<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="30%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="rainbowHair2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="bottomFade2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#cosmicGrad)"/>

  <!-- Celestial Constellation Grid Lines -->
  <g stroke="#818cf8" stroke-opacity="0.2" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Glowing Starlight River Wave -->
  <path d="M -50,180 C 180,60 300,340 500,200 C 650,110 720,240 850,180" fill="none" stroke="#38bdf8" stroke-width="12" stroke-opacity="0.3" filter="url(#glowFilter)"/>
  <path d="M -50,180 C 180,60 300,340 500,200 C 650,110 720,240 850,180" fill="none" stroke="#e0e7ff" stroke-width="3" stroke-dasharray="10 14"/>

  <!-- Star Constellations -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="100" y1="80" x2="180" y2="120"/>
    <line x1="180" y1="120" x2="260" y2="70"/>
    <line x1="260" y1="70" x2="340" y2="110"/>
  </g>
  <circle cx="100" cy="80" r="4" fill="#ffffff" filter="url(#glowFilter)"/>
  <circle cx="180" cy="120" r="5" fill="#38bdf8" filter="url(#glowFilter)"/>
  <circle cx="260" cy="70" r="4" fill="#f472b6" filter="url(#glowFilter)"/>
  <circle cx="340" cy="110" r="5" fill="#fde047" filter="url(#glowFilter)"/>

  <!-- Anime Manga Character on Right: Wizard/Starry Girl looking at Pocket Watch -->
  <g transform="translate(560, 210)">
    <!-- Cat Ears with stars -->
    <path d="M -60,-70 L -100,-150 L -30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M -55,-80 L -85,-135 L -38,-110 Z" fill="#c084fc"/>
    <path d="M 60,-70 L 100,-150 L 30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M 55,-80 L 85,-135 L 38,-110 Z" fill="#c084fc"/>

    <!-- Rainbow Hair -->
    <path d="M -105,-50 C -115,40 -85,130 -45,160 C 0,170 45,170 85,140 C 115,110 115,30 105,-50 Z" fill="url(#rainbowHair2)" stroke="#1e293b" stroke-width="4.5"/>

    <!-- Face -->
    <ellipse cx="0" cy="0" rx="70" ry="60" fill="#fff1f2" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="-42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>
    <ellipse cx="42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>

    <!-- Eyes (Enchanted by stars) -->
    <g transform="translate(-30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#6366f1" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
      <polygon points="0,-12 3,-6 9,-4 4,1 5,7 0,3 -5,7 -4,1 -9,-4 -3,-6" fill="#fde047" transform="scale(0.5) translate(4, 6)"/>
    </g>
    <g transform="translate(30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#6366f1" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
      <polygon points="0,-12 3,-6 9,-4 4,1 5,7 0,3 -5,7 -4,1 -9,-4 -3,-6" fill="#fde047" transform="scale(0.5) translate(4, 6)"/>
    </g>
    <path d="M -8,22 Q 0,28 8,22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bangs -->
    <path d="M -70,-30 C -55,-80 55,-80 70,-30 C 45,-10 25,-30 0,-15 C -25,-30 -45,-10 -70,-30 Z" fill="url(#rainbowHair2)" stroke="#1e293b" stroke-width="4.5"/>

    <!-- Wizard Hat / Star Accent -->
    <polygon points="0,-140 -40,-80 40,-80" fill="#4338ca" stroke="#1e293b" stroke-width="4"/>
    <ellipse cx="0" cy="-80" rx="60" ry="12" fill="#312e81" stroke="#1e293b" stroke-width="4"/>
    <polygon points="0,-115 4,-100 18,-100 7,-90 11,-75 0,-85 -11,-75 -7,-90 -18,-100 -4,-100" fill="#fde047" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Big Glowing Cosmic Pocket Watch on Left -->
  <g transform="translate(240, 220)">
    <circle cx="0" cy="0" r="75" fill="#1e1b4b" stroke="#fde047" stroke-width="6" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
    <!-- Hour marks -->
    <line x1="0" y1="-60" x2="0" y2="-50" stroke="#fde047" stroke-width="3"/>
    <line x1="60" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="3"/>
    <line x1="0" y1="60" x2="0" y2="50" stroke="#fde047" stroke-width="3"/>
    <line x1="-60" y1="0" x2="-50" y2="0" stroke="#fde047" stroke-width="3"/>
    <!-- Hands -->
    <line x1="0" y1="0" x2="28" y2="-28" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-20" y2="20" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#fde047"/>
    <!-- Top Crown -->
    <rect x="-8" y="-90" width="16" height="15" rx="3" fill="#fde047" stroke="#1e293b" stroke-width="3"/>
    <circle cx="0" cy="-96" r="12" fill="none" stroke="#fde047" stroke-width="4"/>
  </g>

  <!-- Speech bubble doodle: "时光长河 ⏳" -->
  <g transform="translate(240, 100)">
    <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
    <path d="M 0,22 L -8,32 L 8,22 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <text x="0" y="6" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="16" fill="#1e1b4b" text-anchor="middle">时光刻度 · 岁月长河 ✨</text>
  </g>

  <rect y="240" width="800" height="240" fill="url(#bottomFade2)"/>
</svg>
