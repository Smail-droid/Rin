<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="35%" stop-color="#dcfce7"/>
      <stop offset="70%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="rainbowHair3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="bottomFade3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#14532d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#mintGrad)"/>

  <!-- Anime Grid & Doodles -->
  <g stroke="#15803d" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Big Instant Camera on Left -->
  <g transform="translate(180, 220)" filter="url(#shadow3)">
    <!-- Camera Body -->
    <rect x="-80" y="-60" width="160" height="120" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="5"/>
    <rect x="-80" y="-20" width="160" height="30" fill="#4ade80" stroke="#1e293b" stroke-width="3"/>
    <!-- Big Lens -->
    <circle cx="0" cy="0" r="42" fill="#1e293b" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="0" r="30" fill="#38bdf8"/>
    <circle cx="-8" cy="-8" r="8" fill="#ffffff"/>
    <!-- Flash Light -->
    <rect x="42" y="-45" width="22" height="18" rx="4" fill="#fde047" stroke="#1e293b" stroke-width="3"/>
    <circle cx="-50" cy="-40" r="8" fill="#f43f5e"/>
    <!-- Shutter Button -->
    <rect x="-65" y="-72" width="25" height="12" rx="4" fill="#1e293b"/>
  </g>

  <!-- Anime Mascot on Right: holding camera with wink -->
  <g transform="translate(560, 210)" filter="url(#shadow3)">
    <path d="M -60,-70 L -100,-150 L -30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M -55,-80 L -85,-135 L -38,-110 Z" fill="#86efac"/>
    <path d="M 60,-70 L 100,-150 L 30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M 55,-80 L 85,-135 L 38,-110 Z" fill="#86efac"/>

    <path d="M -105,-50 C -115,40 -85,130 -45,160 C 0,170 45,170 85,140 C 115,110 115,30 105,-50 Z" fill="url(#rainbowHair3)" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="60" fill="#fff1f2" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="-42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>
    <ellipse cx="42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>

    <!-- Left Eye (Open Sparkling) -->
    <g transform="translate(-30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#16a34a" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
    </g>
    <!-- Right Eye (Winking peace!) -->
    <g transform="translate(30, -4)">
      <path d="M -14,-2 Q 0,-14 14,-2" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <path d="M -8,22 Q 0,28 8,22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bangs -->
    <path d="M -70,-30 C -55,-80 55,-80 70,-30 C 45,-10 25,-30 0,-15 C -25,-30 -45,-10 -70,-30 Z" fill="url(#rainbowHair3)" stroke="#1e293b" stroke-width="4.5"/>

    <!-- Peace Sign Hand -->
    <g transform="translate(-75, 40) rotate(-20)">
      <circle cx="0" cy="0" r="16" fill="#fff1f2" stroke="#1e293b" stroke-width="3.5"/>
      <path d="M -6,-15 L -6,-35" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
      <path d="M 6,-15 L 12,-35" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating WeChat Heart & Photo Bubbles -->
  <g transform="translate(360, 100) rotate(-6)">
    <rect x="-65" y="-22" width="130" height="44" rx="20" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
    <path d="M -10,22 L -20,32 L 0,22 Z" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <text x="0" y="6" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="16" fill="#16a34a" text-anchor="middle">咔嚓！碎碎念 📸</text>
  </g>

  <g transform="translate(350, 240)">
    <!-- WeChat Like Heart Bubble -->
    <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
    <path d="M 0,-4 C -6,-14 -18,-8 -12,2 L 0,14 L 12,2 C 18,-8 6,-14 0,-4 Z" fill="#ef4444"/>
  </g>

  <rect y="240" width="800" height="240" fill="url(#bottomFade3)"/>
</svg>
