<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="35%" stop-color="#ffe4e6"/>
      <stop offset="70%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="rainbowHair6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <linearGradient id="bottomFade6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#deckGrad)"/>

  <!-- Anime Manga Grid -->
  <g stroke="#e11d48" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="480"/><line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Fan of Playing Cards / Polaroid Photos on Left -->
  <g transform="translate(190, 240)">
    <!-- Card 1 (Left Tilt) -->
    <g transform="rotate(-25)" filter="url(#shadow6)">
      <rect x="-45" y="-65" width="90" height="130" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="#38bdf8"/>
      <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">A</text>
    </g>
    <!-- Card 2 (Center Tilt) -->
    <g transform="rotate(-6)" filter="url(#shadow6)">
      <rect x="-45" y="-65" width="90" height="130" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="#f43f5e"/>
      <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">♥</text>
    </g>
    <!-- Card 3 (Right Tilt Joker / Photo) -->
    <g transform="rotate(16)" filter="url(#shadow6)">
      <rect x="-45" y="-65" width="90" height="130" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
      <circle cx="0" cy="0" r="22" fill="#fbbf24"/>
      <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">🃏</text>
    </g>
  </g>

  <!-- Anime Juggler Mascot on Right -->
  <g transform="translate(560, 210)" filter="url(#shadow6)">
    <!-- Cat Ears -->
    <path d="M -60,-70 L -100,-150 L -30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M -55,-80 L -85,-135 L -38,-110 Z" fill="#fb7185"/>
    <path d="M 60,-70 L 100,-150 L 30,-110 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4.5"/>
    <path d="M 55,-80 L 85,-135 L 38,-110 Z" fill="#fb7185"/>

    <!-- Rainbow Hair -->
    <path d="M -105,-50 C -115,40 -85,130 -45,160 C 0,170 45,170 85,140 C 115,110 115,30 105,-50 Z" fill="url(#rainbowHair6)" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="60" fill="#fff1f2" stroke="#1e293b" stroke-width="4.5"/>
    <ellipse cx="-42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>
    <ellipse cx="42" cy="16" rx="14" ry="7" fill="#fb7185" fill-opacity="0.6"/>

    <!-- Left Eye (Happy arc) -->
    <g transform="translate(-30, -4)">
      <path d="M -14,-2 Q 0,-14 14,-2" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <!-- Right Eye (Sparkling) -->
    <g transform="translate(30, -4)">
      <ellipse cx="0" cy="0" rx="16" ry="19" fill="#e11d48" stroke="#1e293b" stroke-width="3"/>
      <circle cx="-5" cy="-6" r="6" fill="#ffffff"/>
      <circle cx="4" cy="4" r="3" fill="#ffffff"/>
    </g>
    <path d="M -8,22 Q 0,30 8,22" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bangs & Jester Star Bow -->
    <path d="M -70,-30 C -55,-80 55,-80 70,-30 C 45,-10 25,-30 0,-15 C -25,-30 -45,-10 -70,-30 Z" fill="url(#rainbowHair6)" stroke="#1e293b" stroke-width="4.5"/>
    <circle cx="0" cy="-65" r="14" fill="#fde047" stroke="#1e293b" stroke-width="3"/>
    <polygon points="0,-72 3,-66 9,-66 4,-61 6,-55 0,-59 -6,-55 -4,-61 -9,-66 -3,-66" fill="#ffffff"/>
  </g>

  <!-- Speech bubble doodle: "漫游图床 🃏" -->
  <g transform="translate(370, 100)">
    <rect x="-85" y="-22" width="170" height="44" rx="22" fill="#ffffff" stroke="#1e293b" stroke-width="3.5"/>
    <text x="0" y="6" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="16" fill="#e11d48" text-anchor="middle">记忆翻动 · 漫游图床 🃏</text>
  </g>

  <rect y="240" width="800" height="240" fill="url(#bottomFade6)"/>
</svg>
